services:
  myfans-downloader:
    build: .
    container_name: myfans-downloader
    environment:
      - CONFIG_DIR=/config
      - DOWNLOADS_DIR=/downloads
      - FILENAME_PATTERN={creator}_{date}_{id}
      - FILENAME_SEPARATOR=_
      - THREAD_COUNT=3
      - AUTH_TOKEN=
      - LOG_FILE=/config/myfans_downloader.log
      - SEGMENT_DOWNLOAD_THREADS=8
      - WRITE_METADATA=0
    volumes:
      - ./config:/config
      - ./downloads:/downloads
    user: "1000:1000"
    cap_drop:
      - ALL
    ports:
      - "5000:5000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
